      "{consumer}": "One CONSUMER node."
      "{database}": "One DATABASE node."
      "{deployment_target}": "A GATEWAY, MICROSERVICE, or WORKFLOW category node."
      "{endpoint}": "One ENDPOINT node."
      "{event}": "One EVENT node."
      "{exposure}": "An External, Internal, or Partner EXPOSURE node."
      "{field}": "One FIELD node."
      "{header}": "One HEADER node."
      "{host}": "A DATABASE or EVENT properties.host value."
      "{http_method}": "A DELETE, GET, PATCH, POST, or PUT HTTP-METHOD node/value."
      "{max_depth}": "A non-negative traversal hop limit."
      "{name_or_text}": "Text matched against node id or name."
      "{operation}": "One OPERATION node."
      "{path_parameter}": "One PATH-PARAMETER node."
      "{query}": "An exact or normalized query value from a data-access edge."
      "{query_parameter}": "One QUERY-PARAMETER node."
      "{schema}": "One SCHEMA node."
      "{security_control}": "One SECURITY node; OAuth 2 is the only value in this snapshot."
      "{service}": "An OPERATION properties.service value."
      "{service_domain}": "One SERVICE-DOMAIN node."
      "{status_code}": "One STATUS-CODE node."
      "{table_name}": "A data-access edge properties.tableName value where populated."
      "{team}": "One TEAMS node."
    collections:
      "{api_node_set}": "Two or more exact API-layer node ids used for set-based impact comparison."
      "{api_version_set}": "Two or more API-VERSION nodes used for structural comparison."
      "{business_node_set}": "Two or more Business-layer node ids used for set-based impact comparison."
      "{runtime_node_set}": "Two or more Runtime-layer node ids used for set-based impact comparison."
    semantic_selectors:
      "{contract_element}": "One request HEADER, PATH-PARAMETER, QUERY-PARAMETER, SCHEMA, or descendant FIELD."
      "{response_element}": "One STATUS-CODE, response HEADER, response SCHEMA, or descendant FIELD."
      "{runtime_target}": "One OPERATION, DATABASE, or EVENT node."
    composite_entity_selectors:
      rule: "A name joined by '_or_' accepts exactly one node of any listed type; it is not a free-text union."
      values:
        "{api_or_endpoint_or_schema_or_field}": "API, ENDPOINT, SCHEMA, or FIELD."
        "{api_or_operation}": "API or OPERATION."
        "{api_or_operation_or_database_or_event}": "API, OPERATION, DATABASE, or EVENT."
        "{api_or_version_or_endpoint_or_operation}": "API, API-VERSION, ENDPOINT, or OPERATION."
        "{api_version_or_endpoint_or_operation}": "API-VERSION, ENDPOINT, or OPERATION."
        "{application_or_api_or_operation}": "APPLICATION, API, or OPERATION."
        "{business_area_or_capability_or_team}": "BUSINESS-AREA, BUSINESS-CAPABILITY, or TEAMS."
        "{business_area_or_domain_or_capability_or_team}": "BUSINESS-AREA, BUSINESS-DOMAIN, BUSINESS-CAPABILITY, or TEAMS."
        "{business_domain_or_service_domain}": "BUSINESS-DOMAIN or SERVICE-DOMAIN."
        "{business_or_api_root}": "A Business-layer node, APPLICATION, API, API-VERSION, ENDPOINT, CONSUMER, or OPERATION root."
        "{consumer_or_api}": "CONSUMER or API."
        "{consumer_or_business_owner}": "CONSUMER, TEAMS, BUSINESS-CAPABILITY, SERVICE-DOMAIN, BUSINESS-DOMAIN, or BUSINESS-AREA."
        "{database_or_event}": "DATABASE or EVENT."
        "{database_or_event_or_field}": "DATABASE, EVENT, or FIELD."
        "{field_or_database_or_event}": "FIELD, DATABASE, or EVENT."
        "{field_or_schema_or_header_or_parameter_or_status_code}": "FIELD, SCHEMA, HEADER, PATH-PARAMETER, QUERY-PARAMETER, or STATUS-CODE."
        "{gateway_or_microservice_or_workflow}": "GATEWAY, MICROSERVICE, or WORKFLOW category node."
        "{operation_or_api}": "OPERATION or API."
        "{path_parameter_or_query_parameter}": "PATH-PARAMETER or QUERY-PARAMETER."
        "{schema_or_field}": "SCHEMA or FIELD."
        "{schema_or_field_or_header_or_parameter}": "SCHEMA, FIELD, HEADER, PATH-PARAMETER, or QUERY-PARAMETER."
        "{schema_or_field_or_header_or_status_code}": "SCHEMA, FIELD, HEADER, or STATUS-CODE."
        "{security_control_or_classification_or_exposure}": "SECURITY, PII, PCI, or EXPOSURE."
        "{security_control_or_exposure_or_classification}": "SECURITY, EXPOSURE, PII, or PCI."
        "{table_name_or_query}": "A data-access edge tableName or query property value."
        "{team_or_capability_or_business_area}": "TEAMS, BUSINESS-CAPABILITY, or BUSINESS-AREA."
  traversal_notation:
    "A -[R]-> B": "Follow a stored edge from source A to target B."
    "A <-[R]- B": "Traverse a stored B-to-A edge in reverse, from target A back to source B."
    "*": "Repeat the adjacent relationship transitively, with cycle protection and a bounded depth."
    "|": "Choose any of the listed relationship types."
  traversal_views:
    forward: >-
      Follow the direction stored in sourceId -> targetId. This is used for containment,
      ownership, exposure, API contracts, deployments, data access, production, calls,
      and routes.
    reverse: >-
      Follow incoming edges from targetId back to sourceId. This answers parent,
      implementer, subscriber, producer, caller, user, and impacted-dependent questions.
    top_down: >-
      Start with business intent or an API portfolio and descend toward contracts and
      runtime dependencies. A semantic top-down journey may cross an incoming IMPLEMENTS
      edge because APPLICATION -[IMPLEMENTS]-> BUSINESS-CAPABILITY is stored technology-to-business.
    bottom_up: >-
      Start with a low-level field, contract element, operation, event, or database and
      trace incoming/reverse edges to the APIs, applications, capabilities, teams, and
      business hierarchy that depend on it.
  blast_radius_definition:
    meaning: >-
      Blast radius is the set of directly and transitively reachable impact candidates
      under an explicit scenario and edge policy. It is structural reachability, not a
      prediction of actual failure, traffic loss, probability, severity, or recovery time.
    required_answer_evidence:
      - "Root node or root-node set and scenario."
      - "Directly affected nodes separated from transitive effects."
      - "One evidence path per affected node, including stored and traversed direction."
      - "Minimum hop depth and counts grouped by layer, node type, and relationship type."
      - "Affected dependents separated from non-propagating business/API context rollups."
      - "Maximum traversal depth, result limit, truncation flag, and cycles encountered."
    scenario_families:
      outage: "Availability loss propagated to callers, routes, producers/consumers, data users, deployments, subscribers, and contained estate as applicable."
      contract_change: "Request, response, field, endpoint, API, or event contract incompatibility propagated toward users and subscribers."
      data_change: "Database, schema, field, payload, or event-data change propagated toward readers, writers, connectors, producers, consumers, and callers."
      security_change: "Authentication, PII, PCI, or exposure-policy change propagated toward governed operations, callers, and consumers."
      deployment_change: "Gateway, microservice, workflow, service, call, or route change propagated toward operations and their callers/subscribers."
      business_change: "Area, domain, capability, team, application, or API portfolio change scoped down to supporting technology and consumers."
      deprecation: "Broad removal or incompatible-change analysis across containers, contracts, runtime dependencies, callers, and subscribers."

