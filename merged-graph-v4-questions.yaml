  catalog_purpose: >-
    A parameterized question catalog for exploring the Business, API, and Runtime
    layers of the graph. Questions use only node attributes and relationship
    signatures present in the source graph. Braced terms are parameters to replace
    with a node id, name, value, set, or traversal depth.
